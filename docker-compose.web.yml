services:
  redblink-dune-docker-console:
    build:
      context: .
      dockerfile: admin-server/Dockerfile
    image: redblink-dune-docker-console:dev
    container_name: redblink-dune-docker-console
    # Web UI: container port 8088, published to host 8088 by default.
    # Optional Traefik routing: see docker-compose.traefik.example.yml
    # Optional Grafana monitoring: see docker-compose.monitoring.example.yml
    restart: unless-stopped
    networks:
      - dune-net
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DUNE_DOCKER_DIR: /repo
      DUNE_CONTAINER_REPO_ROOT: /repo
      DUNE_HOST_REPO_ROOT: "${DUNE_HOST_REPO_ROOT:-${PWD}}"
      # Make RedBlink dune scripts target the main Dune stack, not this web-only compose project.
      COMPOSE_PROJECT_NAME: "${DUNE_COMPOSE_PROJECT_NAME:-dune-awakening-selfhost-docker}"
      ADMIN_BIND_HOST: "0.0.0.0"
      ADMIN_AUTH_DISABLED: "${ADMIN_AUTH_DISABLED:-0}"
      ADMIN_SECURE_COOKIES: "${ADMIN_SECURE_COOKIES:-0}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_TASK_RETENTION: "${ADMIN_TASK_RETENTION:-200}"
      ADMIN_COMMAND_TIMEOUT_MS: "${ADMIN_COMMAND_TIMEOUT_MS:-1800000}"
      ADMIN_MAX_JSON_BYTES: "${ADMIN_MAX_JSON_BYTES:-2097152}"
      ALLOW_HOST_BOOTSTRAP: "${ALLOW_HOST_BOOTSTRAP:-false}"
      ADMIN_MOCK_MODE: "${ADMIN_MOCK_MODE:-0}"
      ADMIN_STATIC_DIR: /app/web-dist
      ADMIN_DATABASE_URL: "${ADMIN_DATABASE_URL:-}"
      DUNE_DB_HOST: "${DUNE_DB_HOST:-dune-postgres}"
      DUNE_DB_PORT: "${DUNE_DB_PORT:-5432}"
      DUNE_DB_NAME: "${DUNE_DB_NAME:-}"
      DUNE_DB_USER: "${DUNE_DB_USER:-}"
      DUNE_DB_PASSWORD: "${DUNE_DB_PASSWORD:-}"
      DUNE_PREFLIGHT_HOST: "${DUNE_PREFLIGHT_HOST:-host.docker.internal}"
      DUNE_COMMAND_AUTH_TOKEN: "${DUNE_COMMAND_AUTH_TOKEN:-}"
      DUNE_SELF_UPDATE_MODE: "${DUNE_SELF_UPDATE_MODE:-}"
      DUNE_SELF_UPDATE_REPO: "${DUNE_SELF_UPDATE_REPO:-}"
      DUNE_SELF_UPDATE_REMOTE: "${DUNE_SELF_UPDATE_REMOTE:-}"
      DUNE_SELF_UPDATE_BRANCH: "${DUNE_SELF_UPDATE_BRANCH:-}"
      DUNE_SELF_UPDATE_TOKEN: "${DUNE_SELF_UPDATE_TOKEN:-}"
    volumes:
      - ./:/repo
      # WARNING: mounting the Docker socket gives this container broad control
      # over the host Docker daemon. Expose the web admin only to trusted admins.
      - ${DUNE_CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  dune-net:
    external: true
    name: dune-net
